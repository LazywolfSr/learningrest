openapi: 3.0.3

info:
  title: S2Anrufe Test API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /api/v1/calls/recent:
    get:
      summary: Letzte Anrufe abrufen
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Liste der letzten Anrufe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"

components:
  schemas:
    Call:
      type: object
      properties:
        id:
          type: integer
        ts:
          type: string
        remote:
          type: string
        display:
          type: string

